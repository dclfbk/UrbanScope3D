name: Build (Next static export)

# Verifica solo che `next build` esca pulito a ogni push (CI check).
#
# Il deploy pubblico NON avviene da questo workflow: il sito e' servito da
# GitHub Pages a partire dalla cartella `docs/` su main
# (Settings -> Pages -> Source: Deploy from a branch -> main -> /docs).
# Per aggiornare il sito si ri-builda l'app e si committa il nuovo `docs/`:
#
#   cd web
#   NEXT_PUBLIC_BASE_PATH=/UrbanScope3D npm run build   # genera web/out
#   # copiare il contenuto di web/out in ../docs (incluso .nojekyll)
#
# URL pubblico: https://dclfbk.github.io/UrbanScope3D/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      # Il basePath qui e' impostato gia' come servira' su Pages, cosi'
      # il build CI verifica anche la compatibilita' con il path finale.
      NEXT_PUBLIC_BASE_PATH: /UrbanScope3D
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
